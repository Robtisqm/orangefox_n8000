name: Build OrangeFox for N8000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Clean Up Runner Space and Install Deps
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick libncurses-dev lib32z1-dev \
          libkrb5-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev \
          python3 python-is-python3 libssl-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize Repo
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir -p ~/fox
        cd ~/fox
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
        repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

    - name: Clone OrangeFox Core & Device Tree
      run: |
        cd ~/fox
        git clone https://gitlab.com/OrangeFox/vendor/recovery.git vendor/recovery --depth=1 -b fox_9.0 || git clone https://github.com/OrangeFox-Recovery/vendor_recovery.git vendor/recovery --depth=1
        git clone https://github.com/html6405/android_device_samsung_n8000 device/samsung/n8000 --depth=1

    - name: Inject OrangeFox Config to BoardConfig
      run: |
        cat <<EOT >> ~/fox/device/samsung/n8000/BoardConfig.mk

        # OrangeFox Flags
        FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER := 1
        TARGET_SCREEN_WIDTH := 1280
        TARGET_SCREEN_HEIGHT := 800
        OF_NO_TREBLE_COMPATIBILITY_CHECK := 1
        OF_DISABLE_MIUI_SPECIFIC_FEATURES := 1
        OF_AB_DEVICE := 0
        OF_DISABLE_MAGISK_ADDON := 1
        EOT

    - name: Building Recovery
      run: |
        cd ~/fox
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        source build/envsetup.sh
        lunch omni_n8000-eng || lunch omni_n8000-userdebug
        mka recoveryimage -j$(nproc --all)

    - name: Prepare Release Files
      run: |
        mkdir -p ~/release
        find ~/fox/out/target/product/n8000/ -type f \( -name "*.img" -o -name "*.zip" \) -exec cp {} ~/release/ \;

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: OrangeFox-N8000-${{ github.run_id }}
        name: OrangeFox Recovery N8000
        files: ~/release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
